name: Generate Changelog & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.2 or 1.0.0, leave empty for daily date)'
        required: false
        default: ''
      edit_message_id:
        description: 'Discord Message ID to edit with new announcement (optional)'
        required: false
        default: ''
      delete_message_id:
        description: 'Discord Message ID to delete (optional)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.actor == 'Sagiroth' || github.actor == 'sagiroth'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Lua regression tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lua5.1
          lua5.1 tests/regression.lua .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute build version
        id: version
        run: |
          python3 tools/generate_changelog.py \
            --out-version version \
            --out-build-number /tmp/build_number.txt \
            --dry-run
          AUTO_VER=$(grep -o 'TB.C.VERSION = "[^"]*"' Constants.lua | cut -d'"' -f2)
          INPUT_VER="${{ inputs.version }}"
          BUILD_NUM=$(cat /tmp/build_number.txt)

          if [ -n "$INPUT_VER" ]; then
            TAG="v$INPUT_VER"
            VER="$INPUT_VER"
          else
            TAG="v$(date -u +%Y-%m-%d)"
            VER="$AUTO_VER"
          fi

          echo "build_version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog & Notes
        id: generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_ENDPOINT: ${{ secrets.OPENCODE_ENDPOINT }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
        run: |
          python3 tools/generate_changelog.py --write --out-notes /tmp/release_notes.md --out-delta /tmp/discord_notes.md

      - name: Commit CHANGELOG.md and version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Constants.lua TortoiseBotsManager.toc
          git commit -m "docs: update CHANGELOG.md for ${{ steps.version.outputs.release_tag }} [skip ci]" || echo "Nothing to commit"
          # Commit first: pulling with the stamped files still unstaged fails.
          git pull --rebase origin main
          git push origin main
          git tag -f "${{ steps.version.outputs.build_version }}"
          git push -f origin "${{ steps.version.outputs.build_version }}"

      - name: Package Addon Zip
        run: |
          python3 tools/package_addon.py --output /tmp/TortoiseBotsManager.zip

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No new PRs (e.g. a re-run): no notes were written, only move the tag.
          if [ -f /tmp/release_notes.md ]; then
            if gh release view "${{ steps.version.outputs.release_tag }}" --repo Sagiroth/TortoiseBotsManager --json tagName >/dev/null 2>&1; then
              echo "Release ${{ steps.version.outputs.release_tag }} already exists. Updating release notes..."
              gh release edit "${{ steps.version.outputs.release_tag }}" \
                --title "TortoiseBotsManager $(date -u +%Y-%m-%d) (builds v1–v${{ steps.version.outputs.build_number }})" \
                --repo Sagiroth/TortoiseBotsManager \
                --notes-file /tmp/release_notes.md
              gh release upload "${{ steps.version.outputs.release_tag }}" /tmp/TortoiseBotsManager.zip \
                --repo Sagiroth/TortoiseBotsManager --clobber
            else
              echo "Creating new release ${{ steps.version.outputs.release_tag }}..."
              gh release create "${{ steps.version.outputs.release_tag }}" /tmp/TortoiseBotsManager.zip \
                --repo Sagiroth/TortoiseBotsManager \
                --title "TortoiseBotsManager $(date -u +%Y-%m-%d) (builds v1–v${{ steps.version.outputs.build_number }})" \
                --notes-file /tmp/release_notes.md \
                --target main
            fi
          fi
          # Move the daily tag to this build: re-point it locally first (the
          # checkout holds the old tag, or none on a new day), then force-push.
          git tag -f "${{ steps.version.outputs.release_tag }}" HEAD
          git push -f origin "${{ steps.version.outputs.release_tag }}"

      - name: Post Release Announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 tools/post_discord_changelog.py \
            --notes /tmp/discord_notes.md \
            --title "TortoiseBotsManager ${{ steps.version.outputs.release_tag }}" \
            --tag "${{ steps.version.outputs.release_tag }}" \
            --repo "Sagiroth/TortoiseBotsManager" \
            --thread-id "${{ vars.DISCORD_RELEASE_THREAD_ID || vars.DISCORD_CHANGELOG_THREAD_ID || secrets.DISCORD_RELEASE_THREAD_ID || secrets.DISCORD_CHANGELOG_THREAD_ID || '1560007927828586586' }}" \
            --username "TortoiseBotsManager Releases" \
            --edit-message-id "${{ inputs.edit_message_id || '' }}" \
            --delete-message-id "${{ inputs.delete_message_id || '' }}" \
            --short
