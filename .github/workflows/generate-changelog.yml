name: Generate Changelog & Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        description: 'Typ wydania (increment)'
        options:
          - 'patch (poprawki błędów, tidy up, małe zmiany: 1.0.X)'
          - 'minor (nowe funkcje, nowe komendy, ficzery: 1.X.0)'
          - 'major (duże przełomowe zmiany: X.0.0)'
          - 'custom (wpisz własną wersję poniżej)'
        default: 'patch (poprawki błędów, tidy up, małe zmiany: 1.0.X)'
      custom_version:
        description: 'Własna wersja (używana jeśli wybrano custom, np. 1.0.0)'
        required: false
        default: '1.0.0'
      edit_message_id:
        description: 'Discord Message ID to edit with new announcement (optional)'
        required: false
        default: ''
      delete_message_id:
        description: 'Discord Message ID to delete (optional)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.actor == 'Sagiroth' || github.actor == 'sagiroth'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Lua regression tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lua5.1
          lua5.1 tests/regression.lua .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute build version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM_VER: ${{ inputs.custom_version }}
        run: |
          python3 - << 'EOF'
          import os, re, subprocess

          bump = os.environ.get("BUMP", "")
          custom_ver = os.environ.get("CUSTOM_VER", "").strip().lstrip("v")

          def parse_semver(t):
              m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", t.strip())
              return tuple(map(int, m.groups())) if m else None

          latest_semver = None
          try:
              out = subprocess.check_output(["git", "tag", "-l"], text=True)
              tags = out.splitlines()
              semver_tags = []
              for t in tags:
                  parsed = parse_semver(t)
                  if parsed:
                      semver_tags.append(parsed)
              if semver_tags:
                  semver_tags.sort()
                  latest_semver = semver_tags[-1]
          except Exception:
              pass

          if not latest_semver and os.path.exists("Constants.lua"):
              try:
                  with open("Constants.lua", "r") as f:
                      m = re.search(r'TB\.C\.VERSION\s*=\s*"([^"]*)"', f.read())
                      if m:
                          parsed = parse_semver(m.group(1))
                          if parsed:
                              latest_semver = parsed
              except Exception:
                  pass

          if bump.startswith("custom") or not latest_semver:
              if custom_ver and parse_semver(custom_ver):
                  target_ver = custom_ver
              elif not latest_semver:
                  target_ver = custom_ver if custom_ver else "1.0.0"
              else:
                  target_ver = f"{latest_semver[0]}.{latest_semver[1]}.{latest_semver[2]}"
          else:
              maj, min_, pat = latest_semver
              if bump.startswith("patch"):
                  target_ver = f"{maj}.{min_}.{pat + 1}"
              elif bump.startswith("minor"):
                  target_ver = f"{maj}.{min_ + 1}.0"
              elif bump.startswith("major"):
                  target_ver = f"{maj + 1}.0.0"
              else:
                  target_ver = f"{maj}.{min_}.{pat + 1}"

          print(f"Computed release version: {target_ver} (from previous: {latest_semver}, bump: {bump})")

          # Update Constants.lua and TortoiseBotsManager.toc
          for path in ["Constants.lua", "TortoiseBotsManager.toc"]:
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
                  if path.endswith(".toc"):
                      content = re.sub(r"(?m)^## Version:.*$", f"## Version: {target_ver}", content)
                  else:
                      content = re.sub(r'TB\.C\.VERSION\s*=\s*"[^"]*"', f'TB.C.VERSION = "{target_ver}"', content)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Updated {path} to version {target_ver}")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"build_version={target_ver}\n")
                  f.write(f"release_tag=v{target_ver}\n")
                  f.write(f"release_date={subprocess.check_output(['date', '-u', '+%Y-%m-%d'], text=True).strip()}\n")
          EOF

      - name: Generate Changelog & Notes
        id: generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_ENDPOINT: ${{ secrets.OPENCODE_ENDPOINT }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
        run: |
          python3 tools/generate_changelog.py \
            --write \
            --out-notes /tmp/release_notes.md \
            --out-delta /tmp/discord_notes.md \
            --tag "${{ steps.version.outputs.release_tag }}" \
            --date "${{ steps.version.outputs.release_tag }} (${{ steps.version.outputs.release_date }})"

      - name: Commit CHANGELOG.md and version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Constants.lua TortoiseBotsManager.toc
          git commit -m "docs: release ${{ steps.version.outputs.release_tag }} [skip ci]" || echo "Nothing to commit"
          git pull --rebase origin main
          git push origin main
          git tag -f "${{ steps.version.outputs.release_tag }}"
          git push -f origin "${{ steps.version.outputs.release_tag }}"

      - name: Package Addon Zip
        run: |
          python3 tools/package_addon.py --output /tmp/TortoiseBotsManager.zip

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_ARG=""
          if [ -f /tmp/release_notes.md ]; then
            NOTES_ARG="--notes-file /tmp/release_notes.md"
          else
            NOTES_ARG="--notes 'Release ${{ steps.version.outputs.release_tag }}'"
          fi

          if gh release view "${{ steps.version.outputs.release_tag }}" --repo Sagiroth/TortoiseBotsManager --json tagName >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.release_tag }} already exists. Updating release notes..."
            gh release edit "${{ steps.version.outputs.release_tag }}" \
              --title "TortoiseBotsManager ${{ steps.version.outputs.release_tag }}" \
              --repo Sagiroth/TortoiseBotsManager \
              $NOTES_ARG \
              --latest
            gh release upload "${{ steps.version.outputs.release_tag }}" /tmp/TortoiseBotsManager.zip \
              --repo Sagiroth/TortoiseBotsManager --clobber
          else
            echo "Creating new release ${{ steps.version.outputs.release_tag }}..."
            gh release create "${{ steps.version.outputs.release_tag }}" /tmp/TortoiseBotsManager.zip \
              --repo Sagiroth/TortoiseBotsManager \
              --title "TortoiseBotsManager ${{ steps.version.outputs.release_tag }}" \
              $NOTES_ARG \
              --target main \
              --latest
          fi

      - name: Post Release Announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 tools/post_discord_changelog.py \
            --notes /tmp/discord_notes.md \
            --title "TortoiseBotsManager ${{ steps.version.outputs.release_tag }}" \
            --tag "${{ steps.version.outputs.release_tag }}" \
            --repo "Sagiroth/TortoiseBotsManager" \
            --thread-id "${{ vars.DISCORD_RELEASE_THREAD_ID || vars.DISCORD_CHANGELOG_THREAD_ID || secrets.DISCORD_RELEASE_THREAD_ID || secrets.DISCORD_CHANGELOG_THREAD_ID || '1560007927828586586' }}" \
            --username "TortoiseBotsManager Releases" \
            --edit-message-id "${{ inputs.edit_message_id || '' }}" \
            --delete-message-id "${{ inputs.delete_message_id || '' }}" \
            --short
